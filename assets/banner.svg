<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131a24"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <circle cx="150" cy="80" r="180" fill="url(#glow1)"/>
  <circle cx="1050" cy="290" r="200" fill="url(#glow2)"/>

  <!-- decorative dice/number motifs, low opacity -->
  <g opacity="0.12" stroke="#8b949e" stroke-width="1.5" fill="none">
    <rect x="90" y="40" width="46" height="46" rx="8"/>
    <circle cx="113" cy="63" r="4" fill="#8b949e" stroke="none"/>
    <rect x="1020" y="230" width="46" height="46" rx="8"/>
    <circle cx="1033" cy="243" r="3.5" fill="#8b949e" stroke="none"/>
    <circle cx="1053" cy="263" r="3.5" fill="#8b949e" stroke="none"/>
    <circle cx="1033" cy="263" r="3.5" fill="#8b949e" stroke="none"/>
    <circle cx="1053" cy="243" r="3.5" fill="#8b949e" stroke="none"/>
  </g>

  <g opacity="0.15" fill="none" stroke="#58a6ff" stroke-width="1.2">
    <circle cx="200" cy="290" r="26"/>
    <circle cx="200" cy="290" r="14"/>
    <line x1="200" y1="264" x2="200" y2="252"/>
    <line x1="200" y1="316" x2="200" y2="328"/>
    <line x1="174" y1="290" x2="162" y2="290"/>
    <line x1="226" y1="290" x2="238" y2="290"/>
  </g>

  <g opacity="0.1" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="14.0">
    <text x="960" y="70" font-family="Segoe UI, Arial, sans-serif">01 10 11</text>
    <text x="1000" y="95" font-family="Segoe UI, Arial, sans-serif">seed: 0x4F2A</text>
    <text x="60" y="330" font-family="Segoe UI, Arial, sans-serif">rand() % 100</text>
  </g>

  <path d="M0,180 Q300,150 600,180 T1200,180" stroke="#30363d" stroke-width="1" fill="none" opacity="0.25"/>
  <path d="M0,210 Q300,240 600,210 T1200,210" stroke="#30363d" stroke-width="1" fill="none" opacity="0.2"/>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58.0" font-weight="600" fill="#ffffff">
    Build Base RNG Script
  </text>

  <text x="600" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22.0" fill="#c9d1d9">
    Build a base RNG Script — a lightweight Windows tool.
  </text>
</svg>